services:
  relay:
    build:
      context: .
      args:
        NEXT_PUBLIC_SEPOLIA_RPC_URL: ${NEXT_PUBLIC_SEPOLIA_RPC_URL:-}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
        NEXT_PUBLIC_SESSION_MINTER: ${NEXT_PUBLIC_SESSION_MINTER:-}
    image: relay-backend:local
    container_name: relay-backend
    restart: unless-stopped

    env_file:
      - .env
    environment:
      RELAY_DATA_DIR: /data

    # The spend meter, decision log and encrypted provider credentials. One replica only.
    volumes:
      - /mnt/Storage1/app-data/relay/data:/data

    networks:
      - proxy

    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.relay-backend.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.relay-backend.entrypoints=web
      - traefik.http.services.relay-backend.loadbalancer.server.port=3000

    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    external: true
